# Integração contínua: roda a cada push e pull request.
# O deploy no Azure (entrega contínua) entra na Sprint 3, em deploy.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  imagem:
    name: API (build da imagem Docker)
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t equilibra-api .

  mobile:
    name: App Flutter (análise e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
